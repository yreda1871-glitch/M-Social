<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>M-Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif
}

body{
  background:#f1f5f9;
  color:#111827;
  min-height:100vh;
  transition:.2s
}

body.dark{
  background:#0f172a;
  color:#f8fafc
}

button,input,textarea{
  font-family:inherit
}

button{
  border:0;
  cursor:pointer
}

header{
  background:#2563eb;
  color:white;
  padding:16px;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 2px 10px #0002
}

.header-inner{
  max-width:850px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.logo{
  font-size:25px;
  font-weight:bold
}

.header-actions{
  display:flex;
  gap:7px
}

.header-btn{
  background:#ffffff22;
  color:white;
  padding:9px 11px;
  border-radius:10px;
  font-size:15px
}

.container{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:15px
}

.card{
  background:white;
  border-radius:16px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 3px 15px #0000000d
}

.dark .card,
.dark .post{
  background:#1e293b;
  color:#f8fafc
}

h2{
  margin-bottom:15px
}

input,textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:11px;
  padding:13px;
  margin-bottom:10px;
  font-size:16px;
  outline:none;
  background:white;
  color:#111827
}

.dark input,
.dark textarea{
  background:#0f172a;
  color:white;
  border-color:#475569
}

textarea{
  min-height:100px;
  resize:vertical
}

.primary{
  width:100%;
  background:#2563eb;
  color:white;
  padding:13px;
  border-radius:11px;
  font-size:16px
}

.secondary{
  background:#e5e7eb;
  color:#111827;
  padding:11px 15px;
  border-radius:10px
}

.dark .secondary{
  background:#334155;
  color:white
}

.danger{
  background:#fee2e2;
  color:#dc2626;
  padding:9px 13px;
  border-radius:9px
}

.hidden{
  display:none!important
}

.auth-buttons{
  display:flex;
  gap:8px
}

.auth-buttons>*{
  flex:1
}

.message{
  padding:10px;
  margin-top:10px;
  border-radius:9px;
  text-align:center
}

.success{
  background:#dcfce7;
  color:#166534
}

.error{
  background:#fee2e2;
  color:#991b1b
}

.profile-top{
  display:flex;
  align-items:center;
  gap:14px
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#2563eb;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
  flex-shrink:0
}

.profile-name{
  font-size:20px;
  font-weight:bold
}

.profile-email{
  color:#6b7280;
  margin-top:4px;
  font-size:13px
}

.dark .profile-email{
  color:#94a3b8
}

.post{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 3px 15px #0000000d
}

.post-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px
}

.post-user{
  font-weight:bold;
  color:#2563eb
}

.post-date{
  font-size:12px;
  color:#6b7280
}

.post-content{
  line-height:1.8;
  white-space:pre-wrap;
  word-break:break-word;
  margin-bottom:13px
}

.post-actions{
  border-top:1px solid #e5e7eb;
  padding-top:10px;
  display:flex;
  gap:7px;
  flex-wrap:wrap
}

.dark .post-actions{
  border-color:#334155
}

.action{
  padding:9px 12px;
  border-radius:9px;
  background:#f1f5f9;
  color:#374151
}

.dark .action{
  background:#334155;
  color:white
}

.liked{
  background:#fee2e2!important;
  color:#dc2626!important
}

.comment-box{
  margin-top:12px;
  border-top:1px solid #e5e7eb;
  padding-top:12px
}

.dark .comment-box{
  border-color:#334155
}

.comment{
  padding:9px;
  background:#f8fafc;
  border-radius:10px;
  margin-bottom:7px
}

.dark .comment{
  background:#0f172a
}

.comment-user{
  font-weight:bold;
  color:#2563eb;
  font-size:14px
}

.comment-text{
  margin-top:4px;
  line-height:1.5
}

.comment-input{
  display:flex;
  gap:7px;
  margin-top:8px
}

.comment-input input{
  margin:0
}

.comment-input button{
  background:#2563eb;
  color:white;
  border-radius:9px;
  padding:0 15px
}

.search-result{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #e5e7eb
}

.dark .search-result{
  border-color:#334155
}

.user-info{
  display:flex;
  align-items:center;
  gap:10px
}

.small-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#2563eb;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold
}

.follow-btn{
  background:#2563eb;
  color:white;
  padding:9px 13px;
  border-radius:9px
}

.following{
  background:#e5e7eb;
  color:#111827
}

.dark .following{
  background:#475569;
  color:white
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #ddd;
  z-index:100;
  display:flex;
  justify-content:center
}

.dark .nav{
  background:#1e293b;
  border-color:#334155
}

.nav-inner{
  width:100%;
  max-width:850px;
  display:flex;
  justify-content:space-around
}

.nav button{
  background:transparent;
  padding:12px 10px;
  color:#475569;
  font-size:13px
}

.dark .nav button{
  color:#cbd5e1
}

.nav button.active{
  color:#2563eb;
  font-weight:bold
}

.page{
  padding-bottom:75px
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px
}

.modal-box{
  background:white;
  color:#111827;
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  border-radius:17px;
  padding:18px
}

.dark .modal-box{
  background:#1e293b;
  color:white
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px
}

.close{
  background:#fee2e2;
  color:#dc2626;
  width:35px;
  height:35px;
  border-radius:50%
}

.chat{
  height:400px;
  overflow:auto;
  padding:10px;
  background:#f8fafc;
  border-radius:12px
}

.dark .chat{
  background:#0f172a
}

.bubble{
  max-width:80%;
  padding:10px;
  border-radius:13px;
  margin-bottom:8px;
  line-height:1.5
}

.mine{
  background:#2563eb;
  color:white;
  margin-right:auto
}

.theirs{
  background:#e5e7eb;
  color:#111827;
  margin-left:auto
}

.dark .theirs{
  background:#334155;
  color:white
}

.chat-send{
  display:flex;
  gap:7px;
  margin-top:10px
}

.chat-send input{
  margin:0
}

.chat-send button{
  background:#2563eb;
  color:white;
  padding:0 18px;
  border-radius:10px
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:25px
}

.loading{
  text-align:center;
  padding:20px;
  color:#6b7280
}

.badge{
  background:#ef4444;
  color:white;
  border-radius:20px;
  padding:2px 7px;
  font-size:11px
}

@media(max-width:600px){
  .container{
    padding:10px
  }

  .logo{
    font-size:21px
  }

  .header-btn{
    padding:8px
  }

  .post-actions .action{
    flex:1
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">🌐 M-Social</div>

    <div class="header-actions">
      <button class="header-btn" onclick="toggleDark()">🌙</button>
      <button class="header-btn" onclick="logout()">خروج</button>
    </div>
  </div>
</header>

<div class="page">

<div class="container">

<!-- ================= LOGIN ================= -->

<div id="authSection">

  <div class="card">

    <h2>🔐 تسجيل الدخول</h2>

    <input id="email" type="email" placeholder="البريد الإلكتروني">

    <input id="password" type="password" placeholder="كلمة المرور">

    <div class="auth-buttons">
      <button class="primary" onclick="login()">دخول</button>
      <button class="secondary" onclick="register()">حساب جديد</button>
    </div>

    <div id="authMessage"></div>

  </div>

</div>


<!-- ================= APP ================= -->

<div id="appSection" class="hidden">

<!-- PROFILE -->

<div class="card">

  <div class="profile-top">

    <div class="avatar" id="mainAvatar">M</div>

    <div>
      <div class="profile-name" id="profileName">مستخدم</div>
      <div class="profile-email" id="profileEmail"></div>
    </div>

  </div>

</div>


<!-- HOME -->

<section id="homePage">

  <div class="card">

    <h2>📝 منشور جديد</h2>

    <textarea
      id="postContent"
      maxlength="5000"
      placeholder="بماذا تفكر؟"
    ></textarea>

    <button class="primary" onclick="createPost()">
      نشر المنشور
    </button>

    <div id="postMessage"></div>

  </div>

  <div id="postsList">
    <div class="loading">جاري تحميل المنشورات...</div>
  </div>

</section>


<!-- SEARCH -->

<section id="searchPage" class="hidden">

  <div class="card">

    <h2>🔎 البحث</h2>

    <input
      id="searchInput"
      placeholder="ابحث عن مستخدم..."
      oninput="searchUsers()"
    >

    <div id="searchResults"></div>

  </div>

</section>


<!-- NOTIFICATIONS -->

<section id="notificationsPage" class="hidden">

  <div class="card">

    <h2>🔔 الإشعارات</h2>

    <div id="notificationsList">
      <div class="loading">جاري التحميل...</div>
    </div>

  </div>

</section>


<!-- PROFILE PAGE -->

<section id="profilePage" class="hidden">

  <div class="card">

    <h2>👤 ملفي الشخصي</h2>

    <div class="profile-top">

      <div class="avatar" id="profileAvatar">M</div>

      <div>
        <div class="profile-name" id="profilePageName"></div>
        <div class="profile-email" id="profilePageEmail"></div>
      </div>

    </div>

    <br>

    <div id="profileStats"></div>

  </div>

  <div class="card">

    <h2>📋 منشوراتي</h2>

    <div id="myPosts"></div>

  </div>

</section>

</div>

</div>

</div>


<!-- ================= NAVIGATION ================= -->

<div id="nav" class="nav hidden">

  <div class="nav-inner">

    <button class="active" onclick="showPage('home',this)">
      🏠<br>الرئيسية
    </button>

    <button onclick="showPage('search',this)">
      🔎<br>بحث
    </button>

    <button onclick="showMessages()">
      💬<br>رسائل
    </button>

    <button onclick="showPage('notifications',this)">
      🔔<br>إشعارات
    </button>

    <button onclick="showPage('profile',this)">
      👤<br>حسابي
    </button>

  </div>

</div>


<!-- ================= MESSAGES MODAL ================= -->

<div id="messagesModal" class="modal hidden">

  <div class="modal-box">

    <div class="modal-head">
      <h2>💬 الرسائل</h2>
      <button class="close" onclick="closeModal('messagesModal')">×</button>
    </div>

    <input
      id="messageUserSearch"
      placeholder="ابحث عن مستخدم للمراسلة..."
      oninput="searchMessageUsers()"
    >

    <div id="messageUsers"></div>

    <div id="chatArea" class="hidden">

      <h3 id="chatTitle"></h3>

      <div id="chatMessages" class="chat"></div>

      <div class="chat-send">

        <input
          id="messageInput"
          placeholder="اكتب رسالتك..."
        >

        <button onclick="sendMessage()">إرسال</button>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://ycjqetdvjvpzlessmkcf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GdHgqXGs8lY7JNWebaXjqA_YUdhTMs5";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;
let currentChatUser = null;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function message(id,text,type){

  $(id).innerHTML =
    `<div class="message ${type}">${text}</div>`;

}


function clearMessage(id){
  $(id).innerHTML="";
}


function userInitial(name){

  if(!name) return "M";

  return name
    .trim()
    .charAt(0)
    .toUpperCase();

}


function formatDate(date){

  return new Date(date)
    .toLocaleString("ar-EG");

}


/* =========================================================
   REGISTER
========================================================= */

async function register(){

  const email=$("email").value.trim();
  const password=$("password").value;

  if(!email || !password){

    message(
      "authMessage",
      "اكتب البريد وكلمة المرور",
      "error"
    );

    return;
  }

  if(password.length<6){

    message(
      "authMessage",
      "كلمة المرور يجب أن تكون 6 أحرف على الأقل",
      "error"
    );

    return;
  }

  const {data,error} =
    await supabaseClient.auth.signUp({
      email,
      password
    });

  if(error){

    message(
      "authMessage",
      error.message,
      "error"
    );

    return;
  }

  if(data.session){

    currentUser=data.user;

    await createProfile();

    showApp();

  }else{

    message(
      "authMessage",
      "تم إنشاء الحساب. يمكنك تسجيل الدخول الآن ✅",
      "success"
    );

  }

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const email=$("email").value.trim();
  const password=$("password").value;

  if(!email || !password){

    message(
      "authMessage",
      "اكتب البريد وكلمة المرور",
      "error"
    );

    return;
  }

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    message(
      "authMessage",
      error.message,
      "error"
    );

    return;
  }

  currentUser=data.user;

  await createProfile();

  showApp();

}


/* =========================================================
   PROFILE
========================================================= */

async function createProfile(){

  if(!currentUser) return;

  const username =
    currentUser.email
      .split("@")[0];

  const {error} =
    await supabaseClient
      .from("profiles")
      .upsert({
        id:currentUser.id,
        username:username
      });

  if(error)
    console.log(error);

}


async function getMyProfile(){

  const {data} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(!data) return;

  const name =
    data.display_name ||
    data.username ||
    currentUser.email.split("@")[0];

  $("profileName").textContent=name;
  $("profilePageName").textContent=name;
  $("profileEmail").textContent=currentUser.email;
  $("profilePageEmail").textContent=currentUser.email;

  $("mainAvatar").textContent=
    userInitial(name);

  $("profileAvatar").textContent=
    userInitial(name);

}


/* =========================================================
   SHOW APP
========================================================= */

async function showApp(){

  $("authSection")
    .classList.add("hidden");

  $("appSection")
    .classList.remove("hidden");

  $("nav")
    .classList.remove("hidden");

  await getMyProfile();

  await loadPosts();

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser=null;

  $("appSection")
    .classList.add("hidden");

  $("authSection")
    .classList.remove("hidden");

  $("nav")
    .classList.add("hidden");

}


/* =========================================================
   CREATE POST
========================================================= */

async function createPost(){

  const content=
    $("postContent").value.trim();

  if(!content){

    message(
      "postMessage",
      "اكتب شيئاً قبل النشر",
      "error"
    );

    return;
  }

  const {error}=
    await supabaseClient
      .from("posts")
      .insert({
        user_id:currentUser.id,
        content:content
      });

  if(error){

    message(
      "postMessage",
      error.message,
      "error"
    );

    return;
  }

  $("postContent").value="";

  message(
    "postMessage",
    "تم النشر بنجاح ✅",
    "success"
  );

  await loadPosts();

}


/* =========================================================
   LOAD POSTS
========================================================= */

async function loadPosts(){

  const list=$("postsList");

  list.innerHTML=
    '<div class="loading">جاري التحميل...</div>';

  const {data:posts,error}=
    await supabaseClient
      .from("posts")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){

    list.innerHTML=
      `<div class="empty">${error.message}</div>`;

    return;
  }

  if(!posts || posts.length===0){

    list.innerHTML=
      '<div class="empty">لا توجد منشورات بعد 📝</div>';

    return;
  }

  const {data:likes}=
    await supabaseClient
      .from("post_likes")
      .select("post_id,user_id");

  const counts={};
  const mine=new Set();

  (likes||[]).forEach(l=>{

    counts[l.post_id] =
      (counts[l.post_id]||0)+1;

    if(l.user_id===currentUser.id)
      mine.add(l.post_id);

  });

  list.innerHTML="";

  for(const post of posts){

    list.appendChild(
      await buildPost(
        post,
        counts[post.id]||0,
        mine.has(post.id)
      )
    );

  }

}


/* =========================================================
   BUILD POST
========================================================= */

async function buildPost(post,likeCount,liked){

  const div=document.createElement("div");

  div.className="post";

  const {data:profile}=
    await supabaseClient
      .from("profiles")
      .select("username,display_name")
      .eq("id",post.user_id)
      .maybeSingle();

  const username=
    profile?.display_name ||
    profile?.username ||
    "مستخدم";

  div.innerHTML=`

    <div class="post-header">

      <div class="post-user">
        👤 ${escapeHtml(username)}
      </div>

      <div class="post-date">
        ${formatDate(post.created_at)}
      </div>

    </div>

    <div class="post-content">
      ${escapeHtml(post.content)}
    </div>

    <div class="post-actions">

      <button
        class="action ${liked?"liked":""}"
        onclick="toggleLike(${post.id})"
      >
        ${liked?"❤️":"🤍"} إعجاب (${likeCount})
      </button>

      <button
        class="action"
        onclick="toggleComments(${post.id})"
      >
        💬 تعليقات
      </button>

      ${
        currentUser.id===post.user_id
        ?
        `<button
          class="danger"
          onclick="deletePost(${post.id})"
        >
          🗑️ حذف
        </button>`
        :
        ""
      }

    </div>

    <div
      id="comments-${post.id}"
      class="comment-box hidden"
    >

      <div id="comment-list-${post.id}">
        <div class="loading">تحميل...</div>
      </div>

      <div class="comment-input">

        <input
          id="comment-input-${post.id}"
          placeholder="اكتب تعليقاً..."
        >

        <button
          onclick="addComment(${post.id})"
        >
          إرسال
        </button>

      </div>

    </div>
  `;

  return div;

}


/* =========================================================
   LIKE
========================================================= */

async function toggleLike(postId){

  const {data:existing}=
    await supabaseClient
      .from("post_likes")
      .select("id")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  if(existing){

    await supabaseClient
      .from("post_likes")
      .delete()
      .eq("id",existing.id);

  }else{

    await supabaseClient
      .from("post_likes")
      .insert({
        post_id:postId,
        user_id:currentUser.id
      });

  }

  await loadPosts();

}


/* =========================================================
   COMMENTS
========================================================= */

async function toggleComments(postId){

  const box=
    $(`comments-${postId}`);

  box.classList.toggle("hidden");

  if(!box.classList.contains("hidden"))
    await loadComments(postId);

}


async function loadComments(postId){

  const list=
    $(`comment-list-${postId}`);

  const {data,error}=
    await supabaseClient
      .from("comments")
      .select("*")
      .eq("post_id",postId)
      .order("created_at",{ascending:true});

  if(error){

    list.innerHTML=
      `<div class="empty">${error.message}</div>`;

    return;
  }

  if(!data || data.length===0){

    list.innerHTML=
      '<div class="empty">لا توجد تعليقات بعد.</div>';

    return;
  }

  list.innerHTML="";

  for(const comment of data){

    const {data:profile}=
      await supabaseClient
        .from("profiles")
        .select("username,display_name")
        .eq("id",comment.user_id)
        .maybeSingle();

    const username=
      profile?.display_name ||
      profile?.username ||
      "مستخدم";

    const el=
      document.createElement("div");

    el.className="comment";

    el.innerHTML=`

      <div class="comment-user">
        ${escapeHtml(username)}
      </div>

      <div class="comment-text">
        ${escapeHtml(comment.content)}
      </div>

    `;

    if(comment.user_id===currentUser.id){

      const del=
        document.createElement("button");

      del.className="danger";
      del.style.marginTop="7px";
      del.textContent="حذف";

      del.onclick=async()=>{

        await supabaseClient
          .from("comments")
          .delete()
          .eq("id",comment.id);

        await loadComments(postId);

      };

      el.appendChild(del);

    }

    list.appendChild(el);

  }

}


async function addComment(postId){

  const input=
    $(`comment-input-${postId}`);

  const content=
    input.value.trim();

  if(!content) return;

  const {error}=
    await supabaseClient
      .from("comments")
      .insert({
        post_id:postId,
        user_id:currentUser.id,
        content:content
      });

  if(error){

    alert(error.message);

    return;
  }

  input.value="";

  await loadComments(postId);

}


/* =========================================================
   DELETE POST
========================================================= */

async function deletePost(postId){

  if(!confirm("هل تريد حذف المنشور؟"))
    return;

  const {error}=
    await supabaseClient
      .from("posts")
      .delete()
      .eq("id",postId)
      .eq("user_id",currentUser.id);

  if(error){

    alert(error.message);

    return;
  }

  await loadPosts();

}


/* =========================================================
   SEARCH USERS
========================================================= */

let searchTimer=null;

async function searchUsers(){

  clearTimeout(searchTimer);

  searchTimer=setTimeout(
    async function(){

      const q=
        $("searchInput").value.trim();

      const results=
        $("searchResults");

      if(!q){

        results.innerHTML="";
        return;

      }

      const {data,error}=
        await supabaseClient
          .from("profiles")
          .select("id,username,display_name")
          .ilike("username","%"+q+"%")
          .limit(20);

      if(error){

        results.innerHTML=
          `<div class="empty">${error.message}</div>`;

        return;
      }

      results.innerHTML="";

      if(!data || data.length===0){

        results.innerHTML=
          '<div class="empty">لا يوجد مستخدمون.</div>';

        return;
      }

      for(const user of data){

        if(user.id===currentUser.id)
          continue;

        results.appendChild(
          await userResult(user)
        );

      }

    },
    300
  );

}


/* =========================================================
   USER RESULT
========================================================= */

async function userResult(user){

  const div=
    document.createElement("div");

  div.className="search-result";

  const name=
    user.display_name ||
    user.username ||
    "مستخدم";

  const {data:follow}=
    await supabaseClient
      .from("follows")
      .select("id")
      .eq("follower_id",currentUser.id)
      .eq("following_id",user.id)
      .maybeSingle();

  div.innerHTML=`

    <div class="user-info">

      <div class="small-avatar">
        ${escapeHtml(userInitial(name))}
      </div>

      <div>
        <b>${escapeHtml(name)}</b>
        <br>
        <small>@${escapeHtml(user.username||"user")}</small>
      </div>

    </div>

    <button
      class="follow-btn ${follow?"following":""}"
      onclick="toggleFollow('${user.id}')"
    >
      ${follow?"✓ متابَع":"➕ متابعة"}
    </button>

  `;

  return div;

}


/* =========================================================
   FOLLOW
========================================================= */

async function toggleFollow(userId){

  const {data:existing}=
    await supabaseClient
      .from("follows")
      .select("id")
      .eq("follower_id",currentUser.id)
      .eq("following_id",userId)
      .maybeSingle();

  if(existing){

    await supabaseClient
      .from("follows")
      .delete()
      .eq("id",existing.id);

  }else{

    await supabaseClient
      .from("follows")
      .insert({
        follower_id:currentUser.id,
        following_id:userId
      });

  }

  await searchUsers();

}


/* =========================================================
   NOTIFICATIONS
========================================================= */

async function loadNotifications(){

  const list=
    $("notificationsList");

  const {data,error}=
    await supabaseClient
      .from("notifications")
      .select("*")
      .eq("user_id",currentUser.id)
      .order("created_at",{ascending:false})
      .limit(50);

  if(error){

    list.innerHTML=
      `<div class="empty">${error.message}</div>`;

    return;
  }

  if(!data || data.length===0){

    list.innerHTML=
      '<div class="empty">لا توجد إشعارات حالياً 🔔</div>';

    return;
  }

  list.innerHTML="";

  data.forEach(n=>{

    const div=
      document.createElement("div");

    div.className="comment";

    let text="إشعار جديد";

    if(n.type==="like")
      text="❤️ شخص أعجب بمنشورك";

    if(n.type==="comment")
      text="💬 شخص علّق على منشورك";

    if(n.type==="follow")
      text="👥 شخص بدأ بمتابعتك";

    div.innerHTML=`
      <b>${text}</b>
      <br>
      <small>${formatDate(n.created_at)}</small>
    `;

    list.appendChild(div);

  });

}


/* =========================================================
   PROFILE STATS
========================================================= */

async function loadProfileStats(){

  const posts=
    await supabaseClient
      .from("posts")
      .select("id",{count:"exact",head:true})
      .eq("user_id",currentUser.id);

  const followers=
    await supabaseClient
      .from("follows")
      .select("id",{count:"exact",head:true})
      .eq("following_id",currentUser.id);

  const following=
    await supabaseClient
      .from("follows")
      .select("id",{count:"exact",head:true})
      .eq("follower_id",currentUser.id);

  $("profileStats").innerHTML=`

    <div style="display:flex;justify-content:space-around;text-align:center">

      <div>
        <b>${posts.count||0}</b>
        <br>
        <small>منشورات</small>
      </div>

      <div>
        <b>${followers.count||0}</b>
        <br>
        <small>متابعون</small>
      </div>

      <div>
        <b>${following.count||0}</b>
        <br>
        <small>أتابع</small>
      </div>

    </div>
  `;

}


/* =========================================================
   MY POSTS
========================================================= */

async function loadMyPosts(){

  const list=$("myPosts");

  const {data}=
    await supabaseClient
      .from("posts")
      .select("*")

/* =========================================================
   MESSAGES
========================================================= */

function showMessages(){

  $("messagesModal")
    .classList.remove("hidden");

  $("chatArea")
    .classList.add("hidden");

  $("messageUserSearch").value="";

  $("messageUsers").innerHTML=
    '<div class="empty">ابحث عن مستخدم لبدء محادثة.</div>';

}


function closeModal(id){

  $(id)
    .classList.add("hidden");

}


async function searchMessageUsers(){

  const q=
    $("messageUserSearch").value.trim();

  if(!q){

    $("messageUsers").innerHTML="";
    return;

  }

  const {data,error}=
    await supabaseClient
      .from("profiles")
      .select("id,username,display_name")
      .ilike("username","%"+q+"%")
      .limit(15);

  if(error){

    $("messageUsers").innerHTML=
      `<div class="empty">${error.message}</div>`;

    return;
  }

  $("messageUsers").innerHTML="";

  for(const user of data){

    if(user.id===currentUser.id)
      continue;

    const name=
      user.display_name ||
      user.username ||
      "مستخدم";

    const div=
      document.createElement("div");

    div.className="search-result";

    div.innerHTML=`

      <div class="user-info">

        <div class="small-avatar">
          ${escapeHtml(userInitial(name))}
        </div>

        <b>${escapeHtml(name)}</b>

      </div>

      <button
        class="follow-btn"
        onclick="openChat('${user.id}','${escapeHtml(name)}')"
      >
        💬 محادثة
      </button>
    `;

    $("messageUsers")
      .appendChild(div);

  }

}


async function openChat(userId,name){

  currentChatUser=userId;

  $("chatArea")
    .classList.remove("hidden");

  $("chatTitle").textContent=
    "💬 " + name;

  await loadMessages();

}


async function loadMessages(){

  const {data,error}=
    await supabaseClient
      .from("messages")
      .select("*")
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser}),and(sender_id.eq.${currentChatUser},receiver_id.eq.${currentUser.id})`
      )
      .order("created_at",{ascending:true});

  if(error){

    $("chatMessages").innerHTML=
      `<div class="empty">${error.message}</div>`;

    return;
  }

  $("chatMessages").innerHTML="";

  (data||[]).forEach(msg=>{

    const div=
      document.createElement("div");

    div.className=
      "bubble " +
      (
        msg.sender_id===currentUser.id
        ? "mine"
        : "theirs"
      );

    div.textContent=
      msg.content;

    $("chatMessages")
      .appendChild(div);

  });

  const chat=
    $("chatMessages");

  chat.scrollTop=
    chat.scrollHeight;

}


async function sendMessage(){

  const input=
    $("messageInput");

  const content=
    input.value.trim();

  if(!content || !currentChatUser)
    return;

  const {error}=
    await supabaseClient
      .from("messages")
      .insert({
        sender_id:currentUser.id,
        receiver_id:currentChatUser,
        content:content
      });

  if(error){

    alert(error.message);
    return;

  }

  input.value="";

  await loadMessages();

}


/* =========================================================
   NAVIGATION
========================================================= */

function hidePages(){

  $("homePage").classList.add("hidden");
  $("searchPage").classList.add("hidden");
  $("notificationsPage").classList.add("hidden");
  $("profilePage").classList.add("hidden");

}


async function showPage(page,button){

  hidePages();

  document
    .querySelectorAll(".nav button")
    .forEach(b=>b.classList.remove("active"));

  if(button)
    button.classList.add("active");

  if(page==="home"){

    $("homePage").classList.remove("hidden");

    await loadPosts();

  }

  if(page==="search"){

    $("searchPage").classList.remove("hidden");

  }

  if(page==="notifications"){

    $("notificationsPage")
      .classList.remove("hidden");

    await loadNotifications();

  }

  if(page==="profile"){

    $("profilePage")
      .classList.remove("hidden");

    await loadProfileStats();

    await loadMyPosts();

  }

}


/* =========================================================
   DARK MODE
========================================================= */

function toggleDark(){

  document.body
    .classList.toggle("dark");

  localStorage.setItem(
    "msocial_dark",
    document.body.classList.contains("dark")
  );

}


if(localStorage.getItem("msocial_dark")==="true"){

  document.body.classList.add("dark");

}


/* =========================================================
   SECURITY / HTML ESCAPE
========================================================= */

function escapeHtml(value){

  return String(value||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   SESSION
========================================================= */

async function checkSession(){

  const {data}=
    await supabaseClient.auth.getSession();

  if(data.session){

    currentUser=
      data.session.user;

    await createProfile();

    await showApp();

  }

}


supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{

    if(session){

      currentUser=
        session.user;

      await createProfile();

      await showApp();

    }

  }
);


/* =========================================================
   START
========================================================= */

checkSession();

</script>
