<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-Social</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin: 25px 0 10px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
      margin-bottom: 18px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 16px;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    input:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      opacity: .9;
    }

    .secondary {
      background: #111827;
    }

    .danger {
      background: #dc2626;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #2563eb;
      cursor: pointer;
    }

    .message {
      text-align: center;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    #app {
      display: none;
    }

    .profile {
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 32px;
      font-weight: bold;
    }

    .profile-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .profile-email {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .hidden {
      display: none !important;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .post-avatar {
      width: 45px;
      height: 45px;
      min-width: 45px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
    }

    .post-user {
      font-weight: bold;
    }

    .post-date {
      color: #9ca3af;
      font-size: 12px;
      margin-top: 3px;
    }

    .post-content {
      font-size: 17px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 10px 0;
    }

    .post-actions {
      border-top: 1px solid #eee;
      padding-top: 10px;
      margin-top: 10px;
    }

    .delete-btn {
      background: #fee2e2;
      color: #b91c1c;
      padding: 9px;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #6b7280;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 25px 10px;
    }

    .section-title {
      font-size: 20px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <!-- تسجيل الدخول -->
  <div id="auth" class="container">

    <div class="logo">M-Social</div>
    <div class="subtitle">تواصل مع العالم 🌍</div>

    <div class="card">

      <div id="message" class="message"></div>

      <!-- Login -->
      <div id="loginBox">

        <h2 style="margin-bottom:18px;">
          تسجيل الدخول
        </h2>

        <input
          type="email"
          id="loginEmail"
          placeholder="البريد الإلكتروني"
          autocomplete="email"
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="كلمة المرور"
          autocomplete="current-password"
        >

        <button onclick="login()">
          تسجيل الدخول
        </button>

        <div class="switch" onclick="showRegister()">
          ليس لديك حساب؟ إنشاء حساب
        </div>

      </div>

      <!-- Register -->
      <div id="registerBox" class="hidden">

        <h2 style="margin-bottom:18px;">
          إنشاء حساب
        </h2>

        <input
          type="text"
          id="registerName"
          placeholder="اسم المستخدم"
          autocomplete="name"
        >

        <input
          type="email"
          id="registerEmail"
          placeholder="البريد الإلكتروني"
          autocomplete="email"
        >

        <input
          type="password"
          id="registerPassword"
          placeholder="كلمة المرور"
          autocomplete="new-password"
        >

        <button onclick="register()">
          إنشاء الحساب
        </button>

        <div class="switch" onclick="showLogin()">
          لديك حساب بالفعل؟ تسجيل الدخول
        </div>

      </div>

    </div>
  </div>


  <!-- التطبيق -->
  <div id="app" class="container">

    <div class="logo">
      M-Social
    </div>

    <!-- Profile -->
    <div class="card profile">

      <div id="avatar" class="avatar">
        M
      </div>

      <div id="profileName" class="profile-name">
        المستخدم
      </div>

      <div id="profileEmail" class="profile-email">
        -
      </div>

      <button class="secondary" onclick="logout()">
        تسجيل الخروج
      </button>

    </div>


    <!-- Create Post -->
    <div class="card">

      <h2 class="section-title">
        📝 ماذا تريد أن تقول؟
      </h2>

      <textarea
        id="postContent"
        placeholder="اكتب منشورك هنا..."
        maxlength="2000"
      ></textarea>

      <button onclick="createPost()">
        🚀 نشر المنشور
      </button>

      <div
        id="postMessage"
        class="message"
        style="margin-top:10px;"
      ></div>

    </div>


    <!-- Posts -->
    <div>

      <h2 class="section-title">
        📰 آخر المنشورات
      </h2>

      <div id="postsList">
        <div class="loading">
          جاري تحميل المنشورات...
        </div>
      </div>

    </div>

  </div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://ycjqetdvjvpzlessmkcf.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_GdHgqXGs8lY7JNWebaXjqA_YUdhTMs5";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  let currentUser = null;


  /* =========================
     MESSAGES
  ========================= */

  function showMessage(text, type = "error") {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";
  }


  function hideMessage() {

    const message =
      document.getElementById("message");

    message.style.display = "none";
  }


  function showPostMessage(text, type = "error") {

    const message =
      document.getElementById("postMessage");

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";
  }


  function hidePostMessage() {

    const message =
      document.getElementById("postMessage");

    message.style.display = "none";
  }


  /* =========================
     LOGIN / REGISTER UI
  ========================= */

  function showLogin() {

    hideMessage();

    document
      .getElementById("loginBox")
      .classList
      .remove("hidden");

    document
      .getElementById("registerBox")
      .classList
      .add("hidden");
  }


  function showRegister() {

    hideMessage();

    document
      .getElementById("loginBox")
      .classList
      .add("hidden");

    document
      .getElementById("registerBox")
      .classList
      .remove("hidden");
  }


  /* =========================
     CREATE PROFILE
  ========================= */

  async function createProfile(
    user,
    username = null
  ) {

    if (!user) return;

    const profileName =
      username ||
      user.user_metadata?.username ||
      user.email?.split("@")[0] ||
      "User";

    const { error } =
      await supabaseClient
        .from("profiles")
        .upsert({
          id: user.id,
          username: profileName
        });

    if (error) {

      console.error(
        "Profile creation error:",
        error
      );

    }

  }


  /* =========================
     REGISTER
  ========================= */

  async function register() {

    hideMessage();

    const name =
      document
        .getElementById("registerName")
        .value
        .trim();

    const email =
      document
        .getElementById("registerEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("registerPassword")
        .value;


    if (!name || !email || !password) {

      showMessage(
        "من فضلك أكمل جميع البيانات."
      );

      return;
    }


    if (password.length < 6) {

      showMessage(
        "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
      );

      return;
    }


    try {

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {
              username: name
            }

          }

        });


      if (error) {

        showMessage(error.message);

        return;
      }


      if (!data.session) {

        showMessage(
          "تم إنشاء الحساب. افتح بريدك الإلكتروني واضغط رابط التأكيد ثم سجّل الدخول.",
          "success"
        );

        return;
      }


      await createProfile(
        data.user,
        name
      );


      showMessage(
        "تم إنشاء الحساب بنجاح!",
        "success"
      );


      setTimeout(() => {

        showApp(data.user);

      }, 700);


    } catch (err) {

      showMessage(
        "حدث خطأ غير متوقع: " +
        err.message
      );

    }

  }


  /* =========================
     LOGIN
  ========================= */

  async function login() {

    hideMessage();

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("loginPassword")
        .value;


    if (!email || !password) {

      showMessage(
        "اكتب البريد الإلكتروني وكلمة المرور."
      );

      return;
    }


    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        showMessage(error.message);

        return;
      }


      await createProfile(
        data.user
      );


      showApp(data.user);


    } catch (err) {

      showMessage(
        "حدث خطأ: " +
        err.message
      );

    }

  }


  /* =========================
     SHOW APP
  ========================= */

  async function showApp(user) {

    currentUser = user;


    document
      .getElementById("auth")
      .style
      .display = "none";


    document
      .getElementById("app")
      .style
      .display = "block";


    document
      .getElementById("profileEmail")
      .textContent =
      user.email || "";


    let username =
      user.user_metadata?.username;


    const { data: profile } =
      await supabaseClient
        .from("profiles")
        .select("username")
        .eq("id", user.id)
        .maybeSingle();


    if (profile?.username) {

      username =
        profile.username;

    }


    username =
      username ||
      user.email?.split("@")[0] ||
      "User";


    document
      .getElementById("profileName")
      .textContent =
      username;


    document
      .getElementById("avatar")
      .textContent =
      username
        .charAt(0)
        .toUpperCase();


    await loadPosts();

  }


  /* =========================
     LOGOUT
  ========================= */

  async function logout() {

    const { error } =
      await supabaseClient.auth.signOut();


    if (error) {

      alert(error.message);

      return;
    }


    currentUser = null;


    document
      .getElementById("app")
      .style
      .display = "none";


    document
      .getElementById("auth")
      .style
      .display = "block";


    showLogin();

  }


  /* =========================
     CREATE POST
  ========================= */

  async function createPost() {

    hidePostMessage();


    if (!currentUser) {

      showPostMessage(
        "يجب تسجيل الدخول أولاً."
      );

      return;
    }


    const textarea =
      document.getElementById(
        "postContent"
      );


    const content =
      textarea.value.trim();


    if (!content) {

      showPostMessage(
        "اكتب شيئًا قبل نشر المنشور."
      );

      return;
    }


    if (content.length > 2000) {

      showPostMessage(
        "المنشور طويل جدًا."
      );

      return;
    }


    try {

      const { error } =
        await supabaseClient
          .from("posts")
          .insert({

            user_id:
              currentUser.id,

            content:
              content

          });


      if (error) {

        console.error(error);

        showPostMessage(
          "حدث خطأ أثناء نشر المنشور: " +
          error.message
        );

        return;
      }


      textarea.value = "";


      showPostMessage(
        "تم نشر المنشور بنجاح 🎉",
        "success"
      );


      await loadPosts();


      setTimeout(() => {

        hidePostMessage();

      }, 2500);


    } catch (err) {

      showPostMessage(
        "حدث خطأ: " +
        err.message
      );

    }

  }


  /* =========================
     LOAD POSTS
  ========================= */

  async function loadPosts() {

    const postsList =
      document.getElementById(
        "postsList"
      );


    postsList.innerHTML =
      '<div class="loading">جاري تحميل المنشورات...</div>';


    try {

      const { data, error } =
        await supabaseClient
          .from("posts")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(error);

        postsList.innerHTML =
          '<div class="empty">حدث خطأ أثناء تحميل المنشورات.</div>';

        return;
      }


      if (!data || data.length === 0) {

        postsList.innerHTML =
          '<div class="card empty">لا توجد منشورات حتى الآن.<br>كن أول من ينشر! 🚀</div>';

        return;
      }


      postsList.innerHTML = "";


      for (const post of data) {

        const postElement =
          await createPostElement(
            post
          );


        postsList.appendChild(
          postElement
        );

      }


    } catch (err) {

      console.error(err);

      postsList.innerHTML =
        '<div class="empty">حدث خطأ غير متوقع.</div>';

    }

  }


  /* =========================
     CREATE POST ELEMENT
  ========================= */

  async function createPostElement(post) {

    const card =
      document.createElement("div");

    card.className = "card";


    let username =
      "مستخدم";


    try {

      const { data: profile } =
        await supabaseClient
          .from("profiles")
          .select("username")
          .eq(
            "id",
            post.user_id
          )
          .maybeSingle();


      if (profile?.username) {

        username =
          profile.username;

      }

    } catch (err) {

      console.error(err);

    }


    const firstLetter =
      username
        .charAt(0)
        .toUpperCase();


    const date =
      new Date(
        post.created_at
      );


    const dateText =
      date.toLocaleString(
        "ar-EG",
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      );


    const header =
      document.createElement("div");

    header.className =
      "post-header";


    const avatar =
      document.createElement("div");

    avatar.className =
      "post-avatar";

    avatar.textContent =
      firstLetter;


    const info =
      document.createElement("div");


    const name =
      document.createElement("div");

    name.className =
      "post-user";

    name.textContent =
      username;


    const postDate =
      document.createElement("div");

    postDate.className =
      "post-date";

    postDate.textContent =
      dateText;


    info.appendChild(name);

    info.appendChild(postDate);


    header.appendChild(avatar);

    header.appendChild(info);


    const content =
      document.createElement("div");

    content.className =
      "post-content";

    content.textContent =
      post.content;


    card.appendChild(header);

    card.appendChild(content);


    if (
      currentUser &&
      post.user_id === currentUser.id
    ) {

      const actions =
        document.createElement("div");

      actions.className =
        "post-actions";


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete-btn";

      deleteButton.textContent =
        "🗑️ حذف المنشور";


      deleteButton.onclick =
        () => deletePost(post.id);


      actions.appendChild(
        deleteButton
      );


      card.appendChild(actions);

    }


    return card;

  }


  /* =========================
     DELETE POST
  ========================= */

  async function deletePost(postId) {

    if (!currentUser) return;


    const confirmed =
      confirm(
        "هل تريد حذف هذا المنشور؟"
      );


    if (!confirmed) return;


    try {

      const { error } =
        await supabaseClient
          .from("posts")
          .delete()
          .eq("id", postId)
          .eq(
            "user_id",
            currentUser.id
          );


      if (error) {

        alert(
          "حدث خطأ: " +
          error.message
        );

        return;
      }


      await loadPosts();


    } catch (err) {

      alert(
        "حدث خطأ: " +
        err.message
      );

    }

  }


  /* =========================
     SESSION
  ========================= */

  async function checkSession() {

    const { data } =
      await supabaseClient.auth.getSession();


    if (data.session?.user) {

      currentUser =
        data.session.user;

      await createProfile(
        currentUser
      );

      await showApp(
        currentUser
      );

    } else {

      document
        .getElementById("auth")
        .style
        .display = "block";

    }

  }


  /* =========================
     AUTH STATE
  ========================= */

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      if (
        event === "SIGNED_IN" &&
        session?.user
      ) {

        currentUser =
          session.user;

        await createProfile(
          session.user
        );

      }

    }
  );


  /* =========================
     START
  ========================= */

  checkSession();

</script>

</body>
</html>
