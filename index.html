<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>M-Social</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 450px;
      margin: auto;
      padding: 20px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin: 35px 0 10px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      opacity: .9;
    }

    .secondary {
      background: #111827;
    }

    .danger {
      background: #dc2626;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #2563eb;
      cursor: pointer;
    }

    .message {
      text-align: center;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    #app {
      display: none;
    }

    .profile {
      text-align: center;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 36px;
      font-weight: bold;
    }

    .profile-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .profile-email {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }
  </style>
</head>

<body>

  <!-- AUTH -->
  <div id="auth" class="container">

    <div class="logo">M-Social</div>
    <div class="subtitle">تواصل مع العالم</div>

    <div class="card">

      <div id="message" class="message"></div>

      <!-- LOGIN -->
      <div id="loginBox">

        <h2 style="margin-bottom:18px;">تسجيل الدخول</h2>

        <input
          type="email"
          id="loginEmail"
          placeholder="البريد الإلكتروني"
          autocomplete="email"
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="كلمة المرور"
          autocomplete="current-password"
        >

        <button onclick="login()">
          تسجيل الدخول
        </button>

        <div class="switch" onclick="showRegister()">
          ليس لديك حساب؟ إنشاء حساب
        </div>

      </div>


      <!-- REGISTER -->
      <div id="registerBox" class="hidden">

        <h2 style="margin-bottom:18px;">إنشاء حساب</h2>

        <input
          type="text"
          id="registerName"
          placeholder="اسم المستخدم"
          autocomplete="name"
        >

        <input
          type="email"
          id="registerEmail"
          placeholder="البريد الإلكتروني"
          autocomplete="email"
        >

        <input
          type="password"
          id="registerPassword"
          placeholder="كلمة المرور"
          autocomplete="new-password"
        >

        <button onclick="register()">
          إنشاء الحساب
        </button>

        <div class="switch" onclick="showLogin()">
          لديك حساب بالفعل؟ تسجيل الدخول
        </div>

      </div>

    </div>
  </div>


  <!-- APP -->
  <div id="app" class="container">

    <div class="logo">M-Social</div>

    <div class="card profile">

      <div id="avatar" class="avatar">
        M
      </div>

      <div id="profileName" class="profile-name">
        المستخدم
      </div>

      <div id="profileEmail" class="profile-email">
        -
      </div>

      <button class="secondary" onclick="logout()">
        تسجيل الخروج
      </button>

    </div>

    <div class="card">
      <h3 style="margin-bottom:10px;">مرحبًا بك 👋</h3>
      <p style="color:#6b7280;">
        تم تسجيل دخولك بنجاح إلى M-Social.
      </p>
    </div>

  </div>


<script>

  /* =========================================================
     SUPABASE CONFIG
     ========================================================= */

  const SUPABASE_URL =
    "https://ycjqetdvjvpzlessmkcf.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_GdHgqXGs8lY7JNWebaXjqA_YUdhTMs5";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================================
     UI
     ========================================================= */

  function showMessage(text, type = "error") {

    const message = document.getElementById("message");

    message.textContent = text;
    message.className = "message " + type;
    message.style.display = "block";

  }


  function hideMessage() {

    const message = document.getElementById("message");

    message.style.display = "none";

  }


  function showLogin() {

    hideMessage();

    document
      .getElementById("loginBox")
      .classList.remove("hidden");

    document
      .getElementById("registerBox")
      .classList.add("hidden");

  }


  function showRegister() {

    hideMessage();

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("registerBox")
      .classList.remove("hidden");

  }


  /* =========================================================
     REGISTER
     ========================================================= */

  async function register() {

    hideMessage();

    const name =
      document.getElementById("registerName").value.trim();

    const email =
      document.getElementById("registerEmail").value.trim();

    const password =
      document.getElementById("registerPassword").value;


    if (!name || !email || !password) {

      showMessage("من فضلك أكمل جميع البيانات.");

      return;

    }


    if (password.length < 6) {

      showMessage("كلمة المرور يجب أن تكون 6 أحرف على الأقل.");

      return;

    }


    try {

      const {
        data,
        error
      } = await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

          data: {
            username: name
          }

        }

      });


      if (error) {

        showMessage(error.message);

        return;

      }


      /*
       * إذا كان تأكيد البريد الإلكتروني مفعّلًا
       * فلن تكون هناك جلسة مباشرة.
       */

      if (!data.session) {

        showMessage(
          "تم إنشاء الحساب. افتح بريدك الإلكتروني واضغط رابط التأكيد ثم سجّل الدخول.",
          "success"
        );

        return;

      }


      /*
       * إذا تم تسجيل الدخول مباشرة
       * ننشئ Profile.
       */

      await createProfile(data.user, name);

      showMessage(
        "تم إنشاء الحساب بنجاح!",
        "success"
      );

      setTimeout(() => {

        showApp(data.user);

      }, 700);


    } catch (err) {

      showMessage(
        "حدث خطأ غير متوقع: " + err.message
      );

    }

  }


  /* =========================================================
     CREATE PROFILE
     ========================================================= */

  async function createProfile(user, username = null) {

    if (!user) return;


    const profileName =
      username ||
      user.user_metadata?.username ||
      user.email?.split("@")[0] ||
      "User";


    /*
     * اسم الجدول المتوقع:
     * profiles
     */

    const {
      error
    } = await supabaseClient
      .from("profiles")
      .upsert({

        id: user.id,

        username: profileName

      });


    if (error) {

      console.error(
        "Profile creation error:",
        error
      );

    }

  }


  /* =========================================================
     LOGIN
     ========================================================= */

  async function login() {

    hideMessage();

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;


    if (!email || !password) {

      showMessage(
        "اكتب البريد الإلكتروني وكلمة المرور."
      );

      return;

    }


    try {

      const {
        data,
        error
      } = await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


      if (error) {

        showMessage(error.message);

        return;

      }


      await createProfile(data.user);

      showApp(data.user);


    } catch (err) {

      showMessage(
        "حدث خطأ: " + err.message
      );

    }

  }


  /* =========================================================
     SHOW APP
     ========================================================= */

  async function showApp(user) {

    document
      .getElementById("auth")
      .style.display = "none";

    document
      .getElementById("app")
      .style.display = "block";


    document
      .getElementById("profileEmail")
      .textContent = user.email || "";


    let username =
      user.user_metadata?.username;


    /*
     * نحاول قراءة Profile
     */

    const {
      data: profile
    } = await supabaseClient
      .from("profiles")
      .select("username")
      .eq("id", user.id)
      .maybeSingle();


    if (profile?.username) {

      username = profile.username;

    }


    username =
      username ||
      user.email?.split("@")[0] ||
      "User";


    document
      .getElementById("profileName")
      .textContent = username;


    document
      .getElementById("avatar")
      .textContent =
      username.charAt(0).toUpperCase();

  }


  /* =========================================================
     LOGOUT
     ========================================================= */

  async function logout() {

    const {
      error
    } = await supabaseClient.auth.signOut();


    if (error) {

      alert(error.message);

      return;

    }


    document
      .getElementById("app")
      .style.display = "none";

    document
      .getElementById("auth")
      .style.display = "block";


    showLogin();

  }


  /* =========================================================
     CHECK CURRENT SESSION
     ========================================================= */

  async function checkSession() {

    const {
      data
    } = await supabaseClient.auth.getSession();


    if (data.session?.user) {

      await createProfile(
        data.session.user
      );

      showApp(
        data.session.user
      );

    } else {

      document
        .getElementById("auth")
        .style.display = "block";

    }

  }


  /* =========================================================
     AUTH STATE
     ========================================================= */

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      if (
        event === "SIGNED_IN" &&
        session?.user
      ) {

        await createProfile(
          session.user
        );

      }

    }
  );


  /* =========================================================
     START
     ========================================================= */

  checkSession();

</script>

</body>
  </html>
